<header>
  <div class="wrap nav">
    <a class="brand" href="/" aria-label="Home">
      <img class="brand-logo" src="/img/warning-dna-red.svg" width="42" height="38" alt="" aria-hidden="true">
      <span class="t">Genetic Diversity Warning<small>Scientists Warning to Humanity</small></span>
    </a>
    {{ if not .Site.Params.comingSoon }}
    <nav class="nav-links">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
    <a href="/#updates" class="nav-cta">Get updates</a>
    {{ end }}
  </div>
</header>
