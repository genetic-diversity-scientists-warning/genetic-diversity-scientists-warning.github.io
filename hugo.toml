baseURL = "https://genetic-diversity-scientists-warning.github.io/"
languageCode = "en-us"
title = "Scientists Warning to Humanity on Genetic Diversity Loss"
enableEmoji = false

[params]
  description = "A consensus paper warning of the loss of genetic diversity across the tree of life."
  coordinator = "Moisés Expósito-Alonso"
  coordinatorAffil = "University of California, Berkeley, Howard Hughes Medical Institute, and Innovative Genomics Institute"
  contactEmail = "moisesexpositoalonso@gmail.com"

  # --- Pre-release gate ---------------------------------------------------
  # When true, the site renders ONLY a "coming soon" splash (nav hidden,
  # noindex on every page). This flag is the ONLY difference between the
  # `pre-release` branch (true, live now) and the `release` branch
  # (false, full site). On launch day flip it to false (or merge the
  # `release` branch into the live one) and redeploy.
  comingSoon = false
  releaseDate = "June 28, 2026"
  # Fallback "Subscribe" button target (opens the Google Form in a new tab).
  signupFormURL = "https://docs.google.com/forms/d/e/1FAIpQLSdbDp4cRNUvIOmTdWLBM5VLuVRAPGyp-9NKGAYnpcUAppgiSg/viewform"
  # Inline email capture (no redirect). Requires a Google Form with a PLAIN
  # (non-verified) short-answer email question accepting anonymous responses:
  #   signupFormAction = that form's .../formResponse URL
  #   signupEmailEntry = the email question's field name, e.g. "entry.123456789"
  # When both are set, the page renders an inline email box instead of the button.
  signupFormAction = ""
  signupEmailEntry = ""

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

